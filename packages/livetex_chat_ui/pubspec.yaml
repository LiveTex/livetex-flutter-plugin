name: livetex_chat_ui
description: Drop-in LiveTex chat UI (Material 3) built on livetex_chat.
version: 0.8.0
publish_to: "none"

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.6"

dependencies:
  flutter:
    sdk: flutter
  livetex_chat:
    path: ../livetex_chat
  cached_network_image: ^3.4.1
  file_picker: ^12.0.0
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  photo_view: ^0.15.0
  # share_plus needed for "Save image" in the full-screen image viewer —
  # opens the system share sheet so the user can save to gallery / share
  # with another app, matching native sdk-ui behavior (Android:
  # DownloadManager → Pictures, iOS: UIActivityViewController).
  share_plus: ^13.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
